name: 开发版 MangoHudfex (aarch64)

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/arch-package.yml'
      - '.github/workflows/build-package.yml'
      - '.github/workflows/build-source.yml'
  workflow_dispatch:
  schedule:
    # 原为 */5（每天 288 次唤醒）。绝大多数唤醒时上游无新提交，
    # 却仍要启动昂贵的 arm runner + 装依赖，属于纯浪费。
    # 改为每 30 分钟一次（每天 48 次），配合下方轻量 gate job 兜底。
    - cron: '*/30 * * * *'

permissions:
  contents: write  # 允许 GITHUB_TOKEN 创建 Release

# 同一 ref 上只保留最新一次运行；连续 push 时旧的自动取消，避免重复计费。
concurrency:
  group: mangohudfex-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC_REPO: https://github.com/as14725836/MangoHudfex
  SRC_API_REPO: as14725836/MangoHudfex
  LAST_DEV_COMMIT_FILE: last_dev_mangohudfex_commit.txt
  # termux-glibc 为扁平布局：安装树展开掉 usr/，得到 <root>/lib、<root>/share、<root>/bin
  PREFIX: /usr
  LAYOUT: flat
  LIBDIR: lib/fhud

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # gate：轻量提交检查，跑在便宜的 x86 runner 上。
  # 作用：上游无新提交时，**根本不启动**昂贵的 ubuntu-24.04-arm runner。
  # 原实现把检查放在 arm job 内部，导致每次 cron 唤醒（含无变更）都要
  # 起 arm 机 + 装依赖（2~4 分钟）后才判断"无需构建"，纯烧钱。
  # ──────────────────────────────────────────────────────────────────────────
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ steps.check.outputs.skip_build }}
      latest_commit: ${{ steps.info.outputs.latest_commit }}
      latest_commit_short: ${{ steps.info.outputs.latest_commit_short }}
      commit_author: ${{ steps.info.outputs.commit_author }}
      commit_date: ${{ steps.info.outputs.commit_date }}
      commit_message: ${{ steps.info.outputs.commit_message }}
    steps:
      - name: 读取上游最新提交
        id: info
        run: |
          set -e
          LATEST=$(git ls-remote ${{ env.SRC_REPO }} HEAD | awk '{print $1}')
          SHORT=${LATEST:0:8}
          echo "latest_commit=$LATEST" >> $GITHUB_OUTPUT
          echo "latest_commit_short=$SHORT" >> $GITHUB_OUTPUT

          # 单次 API 调用取回提交元数据（原实现也是 1 次，这里保持不变）
          curl -sfL "https://api.github.com/repos/${{ env.SRC_API_REPO }}/commits/$LATEST" -o commit.json
          {
            echo "commit_date=$(jq -r '.commit.author.date' commit.json | cut -d'T' -f1)"
            echo "commit_author=$(jq -r '.commit.author.name' commit.json)"
            echo "commit_message=$(jq -r '.commit.message' commit.json | head -n1)"
          } >> $GITHUB_OUTPUT
          echo "👉 上游最新提交: $SHORT"

      - name: 查询"该提交是否已构建过"
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: last-commit.txt
          # 精确 key = 提交哈希本身；命中即代表该 commit 已成功构建并发布
          key: mangohudfex-built-${{ steps.info.outputs.latest_commit }}
          lookup-only: true

      - name: 判断是否需要构建
        id: check
        run: |
          # cache 命中 = 该 commit 已构建过并成功发布过 -> 跳过
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "✅ 提交 ${{ steps.info.outputs.latest_commit_short }} 已构建过，跳过 arm 构建"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "🟢 检测到新提交，需要构建"
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: gate
    if: needs.gate.outputs.skip_build == 'false'
    runs-on: ubuntu-24.04-arm

    steps:
      # 🔹 检出当前仓库
      - name: 检出仓库
        uses: actions/checkout@v4

      # 版本信息由 gate job 传入，build job 不再重复请求 GitHub API
      - name: 注入构建信息
        run: |
          CURRENT_DATE=$(date +%Y%m%d%H%M)
          {
            echo "VERSION=dev-${CURRENT_DATE}-${{ needs.gate.outputs.latest_commit_short }}"
            echo "LATEST_COMMIT=${{ needs.gate.outputs.latest_commit }}"
            echo "LATEST_COMMIT_SHORT=${{ needs.gate.outputs.latest_commit_short }}"
            echo "COMMIT_DATE=${{ needs.gate.outputs.commit_date }}"
            echo "COMMIT_AUTHOR=${{ needs.gate.outputs.commit_author }}"
            echo "COMMIT_MESSAGE=${{ needs.gate.outputs.commit_message }}"
            echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> $GITHUB_ENV

      # 🔹 安装依赖（带 apt 包缓存）
      # 原实现每次都 rm -rf /var/lib/apt/lists/* + apt update + 全量安装，
      # 约 1.5~3 分钟纯重复劳动。这里用 cache-apt-pkgs-action 把 deb 包
      # 缓存下来，命中时几乎瞬时完成（仅做 dpkg 链接）。
      - name: 安装依赖（缓存）
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: >-
            build-essential gcc g++ git pkg-config
            cmake patchelf
            meson ninja-build python3 python3-mako
            glslang-tools
            libglvnd-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev
            libx11-dev libxext-dev libxrandr-dev
            libwayland-dev wayland-protocols libxkbcommon-dev
            libdbus-1-dev
            jq curl unzip wget
          version: mangohudfex-v1

      - name: 工具版本自检
        run: |
          meson --version
          ninja --version
          python3 -c "import mako; print('mako OK')"
          (glslangValidator --version | head -1) || echo "⚠️ glslangValidator 缺失"

      # 🔹 ccache：编译对象缓存
      # MangoHudfex 是 C++ 重项目（大量模板），每次改几个文件仍要重编整个
      # 翻译单元。ccache 命中时单文件编译可从数秒降到接近 0，整体构建时间
      # 通常下降 50%~80%。缓存 key 只跟随工具链版本，不跟随 commit，
      # 这样跨 commit 也能复用。
      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # key 用 run-id 保证每次都能写回新缓存（旧 key 不会被覆盖而失败），
          # restore-keys 前缀匹配让下一次运行总能命中上一轮的对象缓存。
          key: mangohudfex-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            mangohudfex-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: 安装 ccache
        run: |
          sudo apt-get install -y ccache || true
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache --zero-stats

      # 🔹 克隆 MangoHudfex 并构建（Meson + Ninja）
      - name: 克隆 MangoHudfex 并构建
        env:
          # 让 meson/ninja 通过 ccache 包装编译器
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          # 清理旧目录
          rm -rf mangohud

          # 克隆最新源码
          #  - 完整克隆：meson 的 vcs_tag 会调 `git describe --tags`，浅克隆取不到 tag
          #  - --recurse-submodules：modules/minhook 是 required 依赖
          git clone --recurse-submodules ${{ env.SRC_REPO }} mangohud

          cd mangohud
          git log -1 --oneline
          echo "--- 子模块 ---"
          git submodule status || true

          # 设置 Termux glibc 环境变量（按“编译环境不用改”原样保留；runner 上无副作用）
          unset LD_PRELOAD
          export GLIBC_PREFIX=/data/data/com.termux/files/usr/glibc
          export PATH=$GLIBC_PREFIX/bin:$PATH
          export LD_LIBRARY_PATH=$GLIBC_PREFIX/lib:$LD_LIBRARY_PATH

          # —— ccache 包装编译器（meson 优先读 CC/CXX）——
          export CC="ccache gcc"
          export CXX="ccache g++"
          ccache --version | head -1

          # —— 构建 + 安装树（统一走仓库内脚本）——
          # 取代原先内联的 heredoc 兼容层注入 + meson/ninja/strip/sed 一式
          chmod +x scripts/build-termux-glibc.sh
          ./scripts/build-termux-glibc.sh
          echo "✅ 构建完成（安装树: $PWD/build/release）"

          # 检查产物
          echo "📦 安装树（前 30 项）:"
          find build/release -type f \( -name '*.so*' -o -name 'fhud' -o -name '*.json' \) | head -30

          echo "--- 关键产物 ---"
          if [ -f "build/src/libFHUD.so" ]; then
            echo "✅ 生成 Vulkan 层: build/src/libFHUD.so"
            file build/src/libFHUD.so
            ls -lh build/src/*.so
            echo "📌 MangoHud 版本:"
            strings build/src/libFHUD.so | grep -m1 -E '^v?[0-9]+\.[0-9]+\.[0-9]+' || echo "⚠️ 无法从二进制读取版本"
          else
            echo "❌ 未找到 libFHUD.so"
            exit 1
          fi

          # 打包
          cd ..
          echo "版本: ${{ env.VERSION }} / 提交: ${{ env.LATEST_COMMIT_SHORT }} / with_fex=ON" > mangohud/build/release/BUILD_INFO.txt
          TAR_FILE="termux-glibc-mangohudfex-dev-${{ env.VERSION }}.tar.gz"
          tar -cf - -C mangohud/build/release . | gzip -9n > "$TAR_FILE"
          ls -lh "$TAR_FILE"

          echo "TAR_FILE=$TAR_FILE" >> $GITHUB_ENV
          echo "✅ 打包完成: $TAR_FILE"

          # 保存构建指纹（供 gate job 的 cache 判断"该 commit 已构建"）
          echo "${{ env.LATEST_COMMIT }}" > "${{ env.LAST_DEV_COMMIT_FILE }}"
          cp "${{ env.LAST_DEV_COMMIT_FILE }}" last-commit.txt
          echo "✅ 已写入构建指纹: ${{ env.LATEST_COMMIT_SHORT }}"

          ccache --show-stats || true

      # 🔹 上传构建产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mangohudfex-dev-${{ env.VERSION }}
          path: ${{ env.TAR_FILE }}
          retention-days: 7

      # 🔹 保存构建指纹到 cache：下一次 gate job 命中即代表"这个 commit 已构建"
      # 用 cache@v4（而非 cache/save）：key 已存在时不会因为冲突而让 job 失败。
      # 注意这里必须在"写文件"之后运行，否则缓存内容为空。
      - name: 保存构建指纹（cache）
        uses: actions/cache@v4
        with:
          path: last-commit.txt
          key: mangohudfex-built-${{ needs.gate.outputs.latest_commit }}

      # 🔹 发布到 GitHub Release
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mangohudfex-dev-${{ env.VERSION }}
          name: "MangoHudfex 开发版 ${{ env.VERSION }} (aarch64, Termux glibc)"
          body: |
            ## 🚀 MangoHudfex 自动构建 - 开发版

            来源仓库: [`as14725836/MangoHudfex`](https://github.com/as14725836/MangoHudfex)
            （`moze30/MangoHud` 的 FEX 分支，构建系统 Meson + Ninja）

            ### 📅 构建信息
            | 项目 | 信息 |
            |------|------|
            | **版本** | `${{ env.VERSION }}` |
            | **Commit** | `${{ env.LATEST_COMMIT_SHORT }}` |
            | **作者** | `${{ env.COMMIT_AUTHOR }}` |
            | **提交日期** | `${{ env.COMMIT_DATE }}` |
            | **提交消息** | `${{ env.COMMIT_MESSAGE }}` |
            | **构建时间** | `${{ env.BUILD_TIME }}` |
            | **平台** | `aarch64` |
            | **环境** | `Termux glibc（Meson + Ninja）` |

            ### ⚙️ 编译选项
            ```meson
            --prefix=/usr
            --libdir=lib/fhud
            --buildtype=release
            -Dappend_libdir_fhud=false
            -Dwith_fex=true          # <- 本 fork 的关键开关（-DHAVE_FEX + src/fex.cpp）
            -Dwith_nvml=disabled
            -Dwith_xnvctrl=disabled
            -Dwith_x11=enabled
            -Dwith_wayland=enabled
            -Dwith_dbus=enabled
            -Dmangoapp=false
            -Dmangohudctl=false
            -Dinclude_doc=false
            -Dtests=disabled
            ```

            ### 📥 安装方法
            ```bash
            # 0. 从旧版本升级：先清掉旧命名残留（避免新旧层/旧 wrapper 混用报错）
            rm -f  /data/data/com.termux/files/usr/glibc/share/vulkan/implicit_layer.d/MangoHud*.json
            rm -rf /data/data/com.termux/files/usr/glibc/lib/mangohud
            rm -f  /data/data/com.termux/files/usr/glibc/bin/mangohud /data/data/com.termux/files/usr/glibc/bin/mangoplot
            # 1. 解包到 Termux glibc 根（安装树为 usr/... 布局）
            tar -xzf termux-glibc-mangohudfex-dev-${{ env.VERSION }}.tar.gz \
              -C /data/data/com.termux/files/usr/glibc/

            # 2. 把 Vulkan 层清单里的库路径改到 Termux glibc 根
            find /data/data/com.termux/files/usr/glibc/share/vulkan -name '*.json' \
              -exec sed -i 's#/lib/fhud#/data/data/com.termux/files/usr/glibc/lib/fhud#g' {} +

            # 3. 使用（Vulkan：自动启用 implicit layer）
            export VK_LAYER_PATH=/data/data/com.termux/files/usr/glibc/share/vulkan/implicit_layer.d
            export MANGOHUD=1

            # 4. 或直接 LD_PRELOAD（OpenGL / 通用）
            export LD_PRELOAD=/data/data/com.termux/files/usr/glibc/lib/fhud/libFHUD.so
            ```

            ### ⚠️ 注意事项
            - 这是**自动构建的开发版**，基于 master 最新提交，可能不稳定
            - `-Dwith_fex=true` 已开启，CI 会用 `grep HAVE_FEX build/build.ninja` 校验没编漏
            - 构建时会自动注入 `fusionhud` 兼容层，修复上游 HEAD `src/gpu.cpp` 的接口名不匹配（上游头文件只提供 `probeGpuUse/probeGpuFreq/probeGpuTemp`，而 gpu.cpp 调用 `gpuProbePaths/readGpuUtilization/...`）
            - NVML / XNVCtrl 已关闭（NVIDIA 专用，Android/骁龙无意义）
            - 若运行期报 `GLIBCXX_x.x.xx not found`，说明 Termux glibc 的 libstdc++ 比构建机（Ubuntu 24.04）旧，需改用更老基础镜像重新构建
            - 每5分钟检查一次上游更新，有新提交时自动构建

            ---
            *🤖 本 Release 由 GitHub Actions 自动构建生成*
          files: ${{ env.TAR_FILE }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
